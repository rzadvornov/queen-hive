name: publish

# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing:
# no token in the repo. Set it up once on pypi.org (Publishing → add a GitHub publisher:
# owner rzadvornov, repository queen-hive, workflow publish.yml, environment pypi).

on:
  release:
    types: [published]
  workflow_dispatch:   # a manual run only builds and checks the package

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
