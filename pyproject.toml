[project]
name = "haiku-hive"
version = "0.2.0"
description = "The Hive: a Queen model plans and verifies, Haiku worker bees build, scout and review."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
bundled = ["claude-agent-sdk>=0.2.127"]   # brings its own copy of Claude Code, for machines without it
dev = ["pytest>=8"]

[project.scripts]
hive = "hive.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hive*"]

[tool.setuptools.package-data]
hive = ["plugin/**/*", "plugin/.claude-plugin/*", ".claude-plugin/*", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
